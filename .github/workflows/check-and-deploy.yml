name: Evidence identity — check and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      security_reviewed:
        description: Confirm persistent VM, TLS gateway, backups, and IAM are configured
        type: boolean
        required: true
        default: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: evidence-identity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: bash -n deploy/deploy-image.sh
      - name: Build identity image once
        run: docker build -t "evidence-validation-identity:$GITHUB_SHA" .
      - name: Verify migrations on fresh data
        run: docker run --rm "evidence-validation-identity:$GITHUB_SHA" migrate up --dir=/tmp/ev-identity-check --migrationsDir=/pb/pb_migrations
      - name: Smoke-test checked image
        run: |
          docker run --detach --name ev-identity-smoke -p 127.0.0.1:8090:8090 "evidence-validation-identity:$GITHUB_SHA"
          trap 'docker logs ev-identity-smoke; docker rm -f ev-identity-smoke >/dev/null' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-all-errors --max-time 3 --retry-delay 2 http://127.0.0.1:8090/api/health
      - name: Save checked image
        if: github.ref == 'refs/heads/main'
        run: docker save "evidence-validation-identity:$GITHUB_SHA" | gzip > "$RUNNER_TEMP/identity-image.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref == 'refs/heads/main'
        with:
          name: identity-image-${{ github.sha }}
          path: ${{ runner.temp }}/identity-image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || inputs.security_reviewed)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: identity-image-${{ github.sha }}
          path: ${{ runner.temp }}/identity-image
      - run: docker load --input "$RUNNER_TEMP/identity-image/identity-image.tar.gz"
      - name: Check deployment variables
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
          VM: ${{ vars.IDENTITY_VM_NAME }}
          ZONE: ${{ vars.IDENTITY_VM_ZONE }}
        run: |
          for variable in PROJECT REGION REPOSITORY VM ZONE; do
            [[ "${!variable}" =~ ^[a-z0-9-]+$ ]] || { echo "Missing or invalid repository variable: $variable"; exit 1; }
          done
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Push and deploy checked identity image
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
          VM: ${{ vars.IDENTITY_VM_NAME }}
          ZONE: ${{ vars.IDENTITY_VM_ZONE }}
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          image="$REGION-docker.pkg.dev/$PROJECT/$REPOSITORY/evidence-validation-identity:$GITHUB_SHA"
          docker tag "evidence-validation-identity:$GITHUB_SHA" "$image"
          docker push "$image"
          gcloud compute ssh "$VM" --project="$PROJECT" --zone="$ZONE" --tunnel-through-iap --quiet --command="sudo /opt/evidence-validation/deploy-image.sh '$image'"
